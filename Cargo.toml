[package]
name = "cmg"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "Generate git commit messages with an OpenAI-compatible API"
license = "MIT"

[[bin]]
name = "cmg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
