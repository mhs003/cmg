name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

# The version job pushes a commit and a tag back to master.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows users run cmg from PowerShell or cmd, where there is no $HOME and
  # no $XDG_CONFIG_HOME. This job proves the binary finds and writes a config
  # there, and runs a full generation, without a Windows machine in hand.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Config dir resolves without HOME (the PowerShell case)
        shell: pwsh
        run: |
          $env:HOME = $null
          $env:XDG_CONFIG_HOME = $null
          if (-not $env:APPDATA) { throw "APPDATA missing on the runner" }
          .\target\release\cmg.exe init
          $path = Join-Path $env:APPDATA "cmg\config.json"
          if (-not (Test-Path $path)) { throw "init did not write $path" }
          Write-Host "wrote $path"
      - name: Config is discovered from %APPDATA% with no --config
        shell: pwsh
        run: |
          $env:HOME = $null
          $env:XDG_CONFIG_HOME = $null
          $env:CMG_CONFIG = $null
          # The file written by init above must be found on its own. An
          # unconfigured provider then fails with a provider error, and
          # crucially not with the config-directory error.
          $out = & .\target\release\cmg.exe -v 2>&1 | Out-String
          # cmg exits 1 here (the example config has no API key), and pwsh
          # fails the whole step on a non-zero $LASTEXITCODE. Reset it: the
          # assertions below are what decide pass or fail.
          $LASTEXITCODE = 0
          if ($out -match "cannot determine config directory") {
            throw "config dir not resolved on Windows: $out"
          }
          if ($out -notmatch "cmg.json|config.json|api key") {
            Write-Host "note: unexpected output, inspect below"
            Write-Host $out
          }
          Write-Host "ok"
      - name: End-to-end generation against a stub server
        shell: pwsh
        run: |
          $env:HOME = $null
          $env:XDG_CONFIG_HOME = $null
          $repo = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Set-Location $repo
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name smoke
          "x" | Out-File -Encoding ascii a.txt
          git add a.txt

          # One-shot stub that answers with a fixed commit message. A
          # TcpListener on loopback needs no URL ACL, unlike HttpListener.
          $listener = [System.Net.Sockets.TcpListener]::new([ipaddress]::Loopback, 8711)
          $listener.Start()
          $stub = Start-ThreadJob -ScriptBlock {
            param($l)
            try {
              $client = $l.AcceptTcpClient()
              $stream = $client.GetStream()
              $reader = [System.IO.StreamReader]::new($stream)
              # Drain headers (and any body) before answering.
              while ($true) {
                $line = $reader.ReadLine()
                if ([string]::IsNullOrEmpty($line)) { break }
              }
              $body = '{"choices":[{"message":{"content":"feat: windows smoke"}}]}'
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
              $head = "HTTP/1.1 200 OK`r`nContent-Type: application/json`r`nContent-Length: $($bytes.Length)`r`nConnection: close`r`n`r`n"
              $headBytes = [System.Text.Encoding]::ASCII.GetBytes($head)
              $stream.Write($headBytes, 0, $headBytes.Length)
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Flush()
              $client.Close()
            } finally {
              $l.Stop()
            }
          } -ArgumentList $listener
          Start-Sleep -Seconds 1
          if (-not $listener.Server.IsBound) { throw "stub listener did not start" }

          $cfg = Join-Path $repo "cfg.json"
          '{"provider":{"base_url":"http://127.0.0.1:8711/v1","model":"stub","api_key":"k"},"prompt":{"include_log_context":false}}' | Out-File -Encoding ascii $cfg
          $msg = & $env:GITHUB_WORKSPACE\target\release\cmg.exe --config $cfg
          $code = $LASTEXITCODE
          Write-Host "stdout: $msg (exit $code)"
          if ($code -ne 0) { throw "cmg exited $code" }
          if ($msg -ne "feat: windows smoke") { throw "unexpected message: $msg" }
          Remove-Job $stub -Force

  # Decide the next version from Conventional Commits since the last tag,
  # update VERSION + CHANGELOG.md, commit, tag, and push the tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history to walk back to the last tag, and a token that
          # can push tags.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find last release tag
        id: last
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "tag=${last:-}" >> "$GITHUB_OUTPUT"
          echo "last tag: ${last:-<none>}"

      - name: Bump version and changelog
        id: bump
        run: |
          set -euo pipefail
          current=$(tr -d '[:space:]' < VERSION)
          last="${{ steps.last.outputs.tag }}"
          range=${last:+$last..HEAD}
          range=${range:-HEAD}

          set +e
          next=$(scripts/release-notes.sh "$current" "$range")
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "Nothing to release (no feat/fix/breaking commits since ${last:-the start})."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "version bump failed (exit $status)" >&2
            exit "$status"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "next version: $next"

      - name: Verify the crate version matches VERSION
        if: steps.bump.outputs.released == 'true'
        run: |
          set -euo pipefail
          v="${{ steps.bump.outputs.version }}"
          grep -q "^version = \"$v\"" Cargo.toml || {
            echo "Cargo.toml version does not match $v; updating it"
            sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
            # Keep the lockfile consistent with the new package version.
            cargo update --workspace --offline 2>/dev/null || cargo update --workspace
          }

      - name: Commit, tag and push
        if: steps.bump.outputs.released == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "$tag"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$tag"

  # Build one binary per target from the tag and publish the release.
  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux, glibc ---------------------------------------------
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: cmg

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: cmg
            cross_gnu: aarch64-linux-gnu-gcc

          # --- Linux, static musl ---------------------------------------
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: cmg
            musl_x86: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin: cmg
            cross_gnu: aarch64-linux-gnu-gcc

          # --- Termux (Android) -----------------------------------------
          # Termux is Android, not glibc Linux: musl/gnu binaries will not
          # run there. These link against the Android NDK's libc.
          - target: aarch64-linux-android
            os: ubuntu-latest
            bin: cmg
            android_linker: aarch64-linux-android21-clang

          - target: x86_64-linux-android
            os: ubuntu-latest
            bin: cmg
            android_linker: x86_64-linux-android21-clang

          - target: armv7-linux-androideabi
            os: ubuntu-latest
            bin: cmg
            android_linker: armv7a-linux-androideabi21-clang

          # --- macOS -----------------------------------------------------
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: cmg

          - target: aarch64-apple-darwin
            os: macos-latest
            bin: cmg

          # --- Windows ---------------------------------------------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: cmg.exe
            zip: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # A cache miss or restore error must never fail a release.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Configure cross linker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cfg=.cargo/config.toml

          if [ -n "${{ matrix.cross_gnu }}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu
            printf '[target.%s]\nlinker = "%s"\n' \
              "${{ matrix.target }}" "${{ matrix.cross_gnu }}" >> "$cfg"
          fi

          if [ "${{ matrix.musl_x86 }}" = "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
            printf '[target.x86_64-unknown-linux-musl]\nlinker = "musl-gcc"\n' >> "$cfg"
          fi

          if [ -n "${{ matrix.android_linker }}" ]; then
            # Discover the NDK rather than pinning a version, so runner image
            # updates do not break this leg.
            ndk=$(ls -d "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_LATEST_HOME:-}" \
                    /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -1)
            bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
            target="${{ matrix.target }}"
            clang="$bin/${{ matrix.android_linker }}"
            test -x "$clang" || { echo "no Android clang at $clang" >&2; exit 1; }

            printf '[target.%s]\nlinker = "%s"\n' "$target" "$clang" >> "$cfg"

            # Setting the cargo linker is not enough: ring builds C and needs
            # cc-rs to find a compiler too. cc-rs derives the name from the
            # triple, which for armv7 is arm-linux-androideabi-clang -- a name
            # the NDK does not ship (it ships armv7a-...). Point it explicitly.
            # Env var names must use underscores in the target.
            key=$(printf '%s' "$target" | tr '-' '_')
            {
              echo "CC_${key}=${clang}"
              echo "AR_${key}=${bin}/llvm-ar"
              echo "CARGO_TARGET_$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')_LINKER=${clang}"
            } >> "$GITHUB_ENV"

            echo "using CC=${clang}"
          fi

          if [ -s "$cfg" ]; then
            echo "--- $cfg"; cat "$cfg"
          else
            echo "no cross-linker overrides for ${{ matrix.target }}"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "toolchain:"
          for t in sha256sum shasum certutil 7z zip tar; do
            if command -v "$t" >/dev/null 2>&1; then echo "  $t: $(command -v "$t")"; else echo "  $t: missing"; fi
          done
          tag="${{ needs.version.outputs.tag }}"
          name="cmg-${tag}-${{ matrix.target }}"
          bin="${{ matrix.bin }}"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$bin" dist/

          cd dist
          if [ "${{ matrix.zip }}" = "true" ]; then
            archive="$name.zip"
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "../$archive" "$bin" >/dev/null
            else
              zip -q "../$archive" "$bin"
            fi
          else
            archive="$name.tar.gz"
            tar czf "../$archive" "$bin"
          fi
          cd ..

          # sha256sum is GNU-only (absent on macOS); certutil on Windows.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            certutil -hashfile "$archive" SHA256 \
              | sed -n '2p' | tr -d ' \r' | awk -v f="$archive" '{ print $1"  "f }' \
              > "$archive.sha256"
          fi
          cat "$archive.sha256"
          echo "built $archive"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            cmg-*.tar.gz
            cmg-*.tar.gz.sha256
            cmg-*.zip
            cmg-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace, which would delete artifacts
      # downloaded before it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts

      # Use this release's CHANGELOG.md section as the release body.
      - name: Extract changelog section
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          awk -v want="## [$v]" '
            index($0, want) == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No changelog section for $v; falling back to commit list." >&2
            git log --no-merges --pretty='- %s' "$(git tag --list 'v*' --sort=-v:refname | sed -n 2p)..HEAD" > notes.md || true
          fi
          echo "--- release notes ---"; cat notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: false
          body_path: notes.md
          files: |
            artifacts/cmg-*.tar.gz
            artifacts/cmg-*.tar.gz.sha256
            artifacts/cmg-*.zip
            artifacts/cmg-*.zip.sha256
